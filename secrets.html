<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بحث في الحاسوب — غيستالت: اليوم الخامس</title>
  <meta name="description" content="صفحة الأسرار: ابحث في WICKE_PC(D:) كما في اللعبة — الرموز السرية، ملفات مخفية، ورسائل من المطور.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="secrets-page">

  <main id="laptop" class="laptop-wrap">
    <p class="lat laptop-title" dir="ltr">SEARCH WICKE_PC(D:)</p>
    <p class="laptop-hint">اكتب أي شيء للبحث… جرّب أسماء الشخصيات، أو مفردات من اللعبة، أو أشياء لا يجب أن يُقال. اكتب <span class="lat" dir="ltr">EXIT</span> للعودة.</p>

    <form id="searchForm" class="search-row" autocomplete="off">
      <label class="visually-hidden" for="searchInput">اكتب كلمة للبحث في حاسوب ويكي</label>
      <span class="prompt lat" dir="ltr" aria-hidden="true">&gt;_</span>
      <input id="searchInput" class="lat" dir="ltr" type="text" maxlength="100" spellcheck="false" autofocus>
      <button class="btn btn-red" type="submit">بحث</button>
    </form>

    <div id="results" class="results" role="log" aria-live="polite"></div>

    <a class="btn back-btn" href="index.html">← العودة إلى الموقع</a>
  </main>

  <script>
  (function () {
    "use strict";
    var results = document.getElementById("results");
    var input = document.getElementById("searchInput");

    /* الردود مأخوذة حرفيًا من game/laptopaccess.rpy */
    var DB = [
      { keys: ["GESTALT: THE FIFTH DAY"], lines: [
        "A GAME DEVELOPED BY KINJAKO, CREATED BY LEE 'KINJA' JACKSON_",
        "PUBLISHED IN PARTNERSHIP WITH 072 PROJECT_",
        "RELEASED ON THE STEAM PLATFORM IN 2023_",
        "THANK YOU FOR PLAYING_" ] },
      { keys: ["KINJA"], lines: [
        "A SOLO GAME DEVELOPER, ANIMATOR, AND ILLUSTRATOR BORN IN CALIFORNIA, UNITED STATES_",
        "FAVORITE VIDEO GAMES INCLUDE BLOODBORNE, CASTLEVANIA: SYMPHONY OF THE NIGHT, AND MOST OF ALL, FINAL FANTASY IX_",
        "THEY ENJOY BOBA TEA, REPTILES, HORROR, AND ONE PIECE_",
        "THEIR FAVORITE ANIMAL IS THE TORTOISE_" ] },
      { keys: ["WICKE", "TELL ME ABOUT WICKE", "ABOUT WICKE"], lines: [
        "A 28 YEAR OLD OFFICE MANAGER FROM SOMEWHERE IN THE SOUTHERN UNITED STATES_",
        "HOBBIES INCLUDE -HOBBIES NOT FOUND-_",
        "LOVED ONES INCLUDE -LOVED ONES NOT FOUND-_",
        "SHE IS ALLERGIC TO PENICILLIN_",
        "PLEASE PLAY GAME TO FIND MORE INFORMATION_" ] },
      { keys: ["EMMA", "ABOUT EMMA"], lines: ["Hey hey hey!"] },
      { keys: ["OWLS", "OWL"], lines: [
        "BIRDS FROM THE ORDER OF STRIGIFORMES, WHICH INCLUDE 200 SPECIES OF MOSTLY SOLITARY AND NOCTURNAL BIRDS OF PREY_",
        "TYPIFIED BY AN UPRIGHT STANCE, A LARGE, BROAD HEAD, BINOCULAR VISION, BINAURAL HEARING, SHARP TALONS, AND FEATHERS ADAPTED FOR SILENT FLIGHT_",
        "YOU ARE RUNNING OUT OF TIME_" ] },
      { keys: ["RITUAL", "RITUALS"], lines: [
        "NO ONE CAN HELP YOU_",
        "THE ELDRITCH HAND IS WATCHING_" ] },
      { keys: ["SEANCE", "SEANCES"], lines: [
        "NO FILES ON THIS SYSTEM CAN PROVIDE THE ANSWERS YOU SEEK_",
        "PLEASE REFER TO AGATHA MACDONALD'S COLLECTION OF TOMES FOR MORE INFORMATION_",
        "PRAY YOU DO NOT HAVE ANY NEED FOR THIS KNOWLEDGE_" ] },
      { keys: ["RADIO"], lines: [
        "WICKEINA GESTALT IS SEARCHING THE FILES ON HER PERSONAL COMPUTER_",
        "WICKEINA GESTALT IS NOW AWARE OF THE BROADCAST_",
        "WICKEINA GESTALT HAS DECIDED TO IGNORE THE BROADCAST_" ] },
      { keys: ["RATS", "RAT"], lines: [
        "A SPECIES OF LONG-TAILED RODENTS, FOUND IN VARIOUS MEDIUM SIZES_",
        "FOUND WITHIN THE ORDER RODENTIA, IN THE RATTUS GENUS. OTHER GENERA INCLUDE NEOTOMA, BANDICOTA, AND DIPODOMYS_",
        "SOME RATS CAN ONLY BE KILLED OR CAPTURED_" ] },
      { keys: ["YARD PLANTS"], lines: [
        "A YET UNIDENTIFIED SPECIES IN THE GENUS MANDRAGORA WITHIN THE NIGHTSHADE FAMILY, SOLANACEAE_",
        "PREVIOUS AUTOPSIES OF THE BIZZARE REVEAL THE EXISTANCE OF PLOEM SAP, RUFFAGE, BONE, BLOOD, AND TISSUE_",
        "THESE PLANTS HAVE NEVER BEEN OBSERVED AT FULL MATURITY_" ] },
      { keys: ["NICO ROBIN"], lines: [
        "A 30 YEAR OLD ARCHEOLOGIST FROM THE NOW DESTROYED ISLAND OF OHARA_",
        "HER SKILLS INCLUDE RESEARCH, ESPIONAGE, AND ASSASSINATION_",
        "SHE IS COMMONLY SEEN READING IN HER SPARE TIME_" ] },
      { keys: ["DREAM DIVE"], lines: [
        "A FANTASY/COMEDY/ACTION WEBCOMIC CIRCULATED ON THE TAPAS APP AND WEBSITE IN 2018_",
        "THE STORY STARS MARY KIDOGUCHI-BISHOP, A COLLEGE GRAD WHO MUST UNDERGO TRIALS IN HER DREAMS TO OVERCOME HER DOUBTS IN THE REAL WORLD_",
        "THE STORY HAS THREE CHAPTERS, 150 PAGES, AND HAS NOT RECEIVED AN UPDATE SINCE 2018_",
        "THE AUTHOR IS BELIEVED TO BE DECEASED_" ] },
      { keys: ["SAINT VAN JUDAH"], lines: [
        "Ah ah ah.",
        "You should not know that name yet.",
        "All in due time. We'll meet soon enough." ] },
      { keys: ["TRIA FRAGMENTA"], lines: ["LATIN TRANSLATION: THREE PIECES_"] },
      { keys: ["UNUM NOMEN"], lines: ["LATIN TRANSLATION: ONE NAME_"] },
      { keys: ["ROWENA"], lines: [
        "Get a hold of yourself, Wicke...",
        "Let the past die already." ] },
      { keys: ["STREET FIGHTER"], lines: ["HADOKEN_"] },
      { keys: ["KING OF FIGHTERS"], lines: ["ARE YOU OKAY?_"] },
      { keys: ["GUILTY GEAR"], lines: ["TOTSUGEKI!_"] },
      { keys: ["TELL ME A JOKE"], lines: [
        "A SKELETON WALKS INTO A BAR_",
        "HE ORDERS A DRINK AND A MOP_" ] },
      { keys: ["TELL ME A STORY"], lines: [
        "WOULD YOU LIKE A STORY ABOUT STOPPING A GOD THAT'S BEEN SEALED INTO FOUR DIFFERENT CRYSTAL SHARDS?_",
        "THE STORY OF A CHEF IN A DND SETTING TRYING THEIR BEST TO RUN AN HONEST KITCHEN WHILE FINDING ROMANCE?_",
        "HOW ABOUT A STORY OF TWO VAMPIRE HUNTERS WHO ARE TRYING TO STOP AN UNDEAD STAGE MAGICIAN WHO'S ENLISTING WHITE NATIONALISTS INTO HIS HUMAN TRAFFICKING SCHEME?_",
        "SUPPORT THE DEVELOPER AND THEY MAY CREATE ANY OF THESE STORIES THEY HAVE IN MIND_",
        "FOR NOW, A STORY IS ALREADY BEING TOLD TO YOU. GET BACK TO PLAYING IT_" ] },
      { keys: ["CHEAT CODE", "CHEAT CODES"], lines: [
        "YOU'RE ON THE RIGHT TRACK_",
        "BUT YOU'LL NEED TO TRY HARDER THAN THAT_",
        "HINT: KINJA WEARS HIS AGE ON HIS SLEEVE... OR RATHER, IN HIS NAME. FOUR NUMBERS. THEY LOOK LIKE DATES — AND ONE OF THEM IS HIS BIRTHDAY_" ] },
      { keys: ["HINT", "GIVE ME A HINT"], lines: [
        "KINJAKO + 8 DIGITS. MONTH, THEN DAY, THEN YEAR. FOUR OF THEM. HE PICKED DATES THAT MATTER TO HIM_",
        "TRY THINKING ABOUT WHEN SOMEONE IS BORN_" ] },
      { keys: ["PENIS"], lines: ["PLEASE BE MATURE_"] },
      { keys: ["23732343697347979869468974869379"], lines: [
        "Really?",
        "You like looking into game files this much?",
        "Don't go poking your nose through all this mess, trust me. What do you expect to even find in here?",
        "How an artist tries to code only for it to look like a gibbon did it? Here to find secrets?",
        "*sigh* Fine, whatever.",
        "Just keep your voice down and don't bother me." ] },
      /* الرموز السرية الفعلية من اللعبة */
      { keys: ["KINJAKO022920"], secret: true, lines: [
        "*صوتُ اكتشافٍ سرٍّ*",
        "YOU HAVE UNLOCKED SCENARIO PICKER!" ] },
      { keys: ["KINJAKO101493"], secret: true, lines: [
        "*صوتُ اكتشافٍ سرٍّ*",
        "YOU HAVE UNLOCKED SUPER EMMA MODE!" ] },
      { keys: ["KINJAKO040524"], secret: true, lines: [
        "*صوتُ اكتشافٍ سرٍّ*",
        "YOU HAVE UNLOCKED THE MYSTERY SKULL!" ] },
      { keys: ["KINJAKO254980"], secret: true, lines: [
        "*صوتُ اكتشافٍ سرٍّ*",
        "YOU HAVE UNLOCKED THE LAST DUNGEON (FREE-PLAY MODE)!",
        "CLICK THE ICON TO PLAY_" ] }
    ];

    var found = {};

    function findEntry(q) {
      q = q.trim().toUpperCase();
      if (!q) return null;
      for (var i = 0; i < DB.length; i++) {
        var keys = DB[i].keys;
        for (var k = 0; k < keys.length; k++) {
          if (keys[k] === q) return DB[i];
        }
      }
      return null;
    }

    function esc(s) {
      return s.replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    var allFoundShown = false;

    function render(entry, query) {
      var html = "";
      html += '<p class="lat q-line" dir="ltr">&gt; ' + esc(query.toUpperCase()) + '</p>';
      if (query.trim().toUpperCase() === "EXIT") {
        html += '<p class="lat line" dir="ltr">LEAVING_</p>';
        setTimeout(function () { location.href = "index.html"; }, 900);
      } else if (entry) {
        if (entry.secret) {
          var wasNew = !found[entry.keys[0]];
          found[entry.keys[0]] = true;
          var n = Object.keys(found).length;
          html += '<p class="lat line secret-found" dir="ltr">' + entry.lines.map(esc).join("<br>") + '</p>';
          html += '<p class="lat secret-count" dir="ltr">SECRETS FOUND: ' + n + '/4</p>';
          if (n === 4 && !allFoundShown) {
            allFoundShown = true;
            html += [
              '<div class="master-reveal">',
              '<p class="lat line" dir="ltr">...</p>',
              '<p>كلُّ الشاشات في البيت ومضت للحظة.</p>',
              '<p class="lat line" dir="ltr">ACHIEVEMENT UNLOCKED: SECRET MASTER</p>',
              '<p>سيد السر</p>',
              '<p class="master-desc">افتح وفعّل كل الرموز السرية في اللعبة.</p>',
              '<p>...هل تشعر أن حاسوب ويكي يعرف الآن من أنت؟</p>',
              '</div>'
            ].join("");
            document.body.classList.add("all-found");
          }
        } else {
          html += '<p class="lat line" dir="ltr">' + entry.lines.map(esc).join("<br>") + '</p>';
        }
      } else {
        html += '<p class="lat line" dir="ltr">NO RESULTS FOUND_</p>';
      }
      results.innerHTML = html;
    }

    document.getElementById("searchForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var q = input.value;
      render(findEntry(q), q);
    });

    input.addEventListener("keydown", function (e) {
      if (e.key === "Escape") location.href = "index.html";
    });
  })();
  </script>
</body>
</html>
